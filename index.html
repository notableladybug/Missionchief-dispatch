<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notableladybug | Tampermonkey Scripts & Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <!-- Three.js og Vanta.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: rgba(19, 27, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #c09c00;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo span { color: var(--accent); }

        .hero {
            text-align: center;
            padding: 80px 20px 60px;
            max-width: 880px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .hero-dot { color: var(--accent); }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background-color: #e5ba00;
            color: #000;
        }

        .products-section {
            max-width: 1200px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-header h2 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .section-header p {
            color: var(--text-muted);
            margin-top: 8px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
            backdrop-filter: blur(10px);
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .tag {
            align-self: flex-start;
            background-color: rgba(192, 156, 0, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .product-card h3 {
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .product-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .product-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
        }

        @media (max-width: 768px) {
            .navbar { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="vanta-bg"></div>

    <nav class="navbar">
        <a href="#" class="logo">Notableladybug<span>.</span></a>
    </nav>

    <main>
        <header class="hero">
            <h1>A better experience<span class="hero-dot">.</span><br>A better game<span class="hero-dot">.</span></h1>
            <p>A quick, optimized and useful Missionchief addon.</p>
        </header>

        <section id="scripts" class="products-section">
            <div class="section-header">
                <h2>Available Scripts</h2>
                <p>Press the 'Install' button and add it to Tampermonkey.</p>
            </div>

            <div class="product-grid">
                <div class="product-card">
                    <div>
                        <span class="tag">Tampermonkey</span>
                        <h3>Notableladybug<span class="hero-dot">.</span></h3>
                        <p>Adds a useful dispatch overview.</p>
                    </div>
                    <div class="product-footer">
                        <a href="https://raw.githubusercontent.com/notableladybug/Missionchief-dispatch/main/dashboard.user.js" class="btn btn-primary">⚡ Install</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        VANTA.CELLS({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            color2: 0xc09c00,
            color1: 0x0f172a
        });
    </script>
</body>
</html>
